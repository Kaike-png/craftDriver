name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Dependências (FUSE3)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3 libfuse3-3 attr
          sudo chmod 666 /dev/fuse
          grep -q '^user_allow_other' /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: Testes
        run: dotnet test CraftDriver.slnx -c Release

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Versão
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(grep -oP '(?<=<Version>)[^<]+' src/CraftDriver.App/CraftDriver.App.csproj)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Gerar pacotes (.tar.gz, .deb, .rpm, PKGBUILD)
        run: packaging/build.sh "${{ steps.ver.outputs.version }}"
      - name: Testar pacotes em contêineres (Ubuntu, Debian, Fedora, Arch)
        run: packaging/test/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: craftdriver-${{ steps.ver.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/aur/
            dist/test/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd art
          cp aur/PKGBUILD PKGBUILD
          cp test/*.pkg.tar.zst .
          sha256sum *.tar.gz *.deb *.rpm *.pkg.tar.zst > SHA256SUMS
          files=(*.tar.gz *.sha256 *.deb *.rpm *.pkg.tar.zst PKGBUILD SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            notes="packaging/release-notes/${GITHUB_REF_NAME}.md"
            if [ -f "../$notes" ]; then gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "craftDriver $GITHUB_REF_NAME" --notes-file "../$notes"
            else gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "craftDriver $GITHUB_REF_NAME" --generate-notes; fi
          fi
