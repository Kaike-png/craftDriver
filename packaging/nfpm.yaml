# Configuração do nfpm (https://nfpm.goreleaser.com) para gerar .deb e .rpm.
# Modelo: packaging/build.sh troca @VERSION@ e @STAGING@ e gera dist/nfpm.yaml.
name: craftdriver
arch: amd64
platform: linux
version: @VERSION@
release: "1"
section: net
priority: optional
maintainer: Kaike de Paula <kaikedepaula8@gmail.com>
vendor: craftDriver
homepage: https://github.com/Kaike-png/craftDriver
license: MIT
description: |
  Cliente para OneDrive e SharePoint com arquivos sob demanda.
  Monta suas contas Microsoft (pessoais, trabalho/escola e bibliotecas do
  SharePoint) em ~/OneDrive via FUSE: os arquivos aparecem sem ocupar espaço
  e são baixados ao abrir. Projeto independente, não afiliado à Microsoft.

overrides:
  deb:
    depends:
      - fuse3
      - libfontconfig1
      - libx11-6
      - libice6
      - libsm6
      - libicu78 | libicu77 | libicu76 | libicu74 | libicu72 | libicu71 | libicu70 | libicu67
    recommends:
      - libsecret-1-0
      - fonts-dejavu-core
      - fonts-noto-color-emoji
  rpm:
    depends:
      - fuse3
      - fontconfig
      - libX11
      - libICE
      - libSM
      - libicu
    recommends:
      - libsecret
      - dejavu-sans-fonts
      - google-noto-color-emoji-fonts

contents:
  - src: @STAGING@/craftdriver
    dst: /usr/lib/craftdriver/craftdriver
    file_info:
      mode: 0755
  - src: /usr/lib/craftdriver/craftdriver
    dst: /usr/bin/craftdriver
    type: symlink
  - src: @STAGING@/share/applications/craftdriver.desktop
    dst: /usr/share/applications/craftdriver.desktop
    file_info:
      mode: 0644
  - src: @STAGING@/share/kio/servicemenus/craftdriver.desktop
    dst: /usr/share/kio/servicemenus/craftdriver.desktop
    file_info:
      mode: 0755
  - src: @STAGING@/share/icons/hicolor/256x256/apps/craftdriver.png
    dst: /usr/share/icons/hicolor/256x256/apps/craftdriver.png
    file_info:
      mode: 0644
  - src: @STAGING@/LICENSE
    dst: /usr/share/licenses/craftdriver/LICENSE
    file_info:
      mode: 0644
  - src: @STAGING@/README.md
    dst: /usr/share/doc/craftdriver/README.md
    file_info:
      mode: 0644

rpm:
  summary: Cliente para OneDrive e SharePoint com arquivos sob demanda
  group: Applications/Internet
  compression: zstd
deb:
  compression: zstd
