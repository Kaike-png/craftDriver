# Configuração do nfpm (https://nfpm.goreleaser.com) para gerar .deb e .rpm.
# Modelo: packaging/build.sh troca @VERSION@ e @STAGING@ e gera dist/nfpm.yaml.
name: craftdriver
arch: @ARCH@
platform: linux
version: @VERSION@
release: "1"
section: net
priority: optional
maintainer: Kaike de Paula <kaikedepaula8@gmail.com>
vendor: craftDriver
homepage: https://github.com/Kaike-png/craftDriver
license: MIT
description: |
  Cliente para OneDrive e SharePoint com arquivos sob demanda.
  Monta suas contas Microsoft (pessoais, trabalho/escola e bibliotecas do
  SharePoint) em ~/OneDrive via FUSE: os arquivos aparecem sem ocupar espaço
  e são baixados ao abrir. Projeto independente, não afiliado à Microsoft.

overrides:
  deb:
    depends:
      - fuse3
      - libfontconfig1
      - libx11-6
      - libice6
      - libsm6
      # Runtime .NET: libssl vem por dlopen (ldd não acusa); sem ele o login aborta. Sem raízes, UntrustedRoot.
      # Debian 12 = libssl3; Debian 13 / Ubuntu 24.04 = libssl3t64.
      - libssl3t64 | libssl3
      - ca-certificates
      - libstdc++6
      - zlib1g
      # ICU fica: com InvariantGlobalization números/datas sairiam em formato inglês (ver docs/empacotamento.md)
      - libicu78 | libicu77 | libicu76 | libicu74 | libicu72 | libicu71 | libicu70 | libicu67
      - xdg-utils          # xdg-open: abrir a pasta, o navegador do login e os links
      - dbus-bin | dbus    # dbus-send: iniciar o chaveiro e mostrar o arquivo no gerenciador
    recommends:
      - libsecret-1-0
      - libgssapi-krb5-2    # Negotiate/Kerberos (opcional para o OAuth do OneDrive)
      - libnotify-bin      # notify-send: só se o serviço de notificações não responder pelo D-Bus
      - wl-clipboard | xclip | xsel   # copiar o link de compartilhamento
      - fonts-dejavu-core
      - fonts-noto-color-emoji
    suggests:
      - python3-nautilus   # extensão do Nautilus (emblemas + menu)
      - attr               # getfattr, usado pelas ações do PCManFM
      - python3            # /usr/share/craftdriver/thunar/install-uca.py (ações do Thunar)
      - pkexec | policykit-1   # "Atualizar agora" pede a senha de administrador (sem ele: comando para o terminal)
  rpm:
    depends:
      - fuse3
      - fontconfig
      - libX11
      - libICE
      - libSM
      - openssl-libs
      - ca-certificates
      - libstdc++
      - zlib
      - libicu
      - xdg-utils
      - dbus-tools
    recommends:
      - libsecret
      - krb5-libs
      - libnotify
      - (wl-clipboard or xclip or xsel)
      - dejavu-sans-fonts
      - google-noto-color-emoji-fonts
    suggests:
      - nautilus-python    # extensão do Nautilus (emblemas + menu)
      - attr               # getfattr, usado pelas ações do PCManFM
      - python3            # /usr/share/craftdriver/thunar/install-uca.py (ações do Thunar)
      - polkit             # pkexec: "Atualizar agora" pede a senha de administrador

contents:
  # o app inteiro (apphost "craftdriver" + DLLs + .so); "tree" preserva os modos dos arquivos
  - src: @STAGING@/lib
    dst: /usr/lib/craftdriver
    type: tree
  - src: /usr/lib/craftdriver/craftdriver
    dst: /usr/bin/craftdriver
    type: symlink
  - src: @STAGING@/share/applications/craftdriver.desktop
    dst: /usr/share/applications/craftdriver.desktop
    file_info:
      mode: 0644
  - src: @STAGING@/share/kio/servicemenus/craftdriver.desktop
    dst: /usr/share/kio/servicemenus/craftdriver.desktop
    file_info:
      mode: 0755
  # Extensões de gerenciador de arquivos (extensions/). Inertes se o gerenciador não estiver instalado.
  - src: @STAGING@/share/nautilus-python/extensions/craftdriver.py
    dst: /usr/share/nautilus-python/extensions/craftdriver.py
    file_info:
      mode: 0644
  - src: @STAGING@/share/file-manager/actions/craftdriver-menu.desktop
    dst: /usr/share/file-manager/actions/craftdriver-menu.desktop
    file_info:
      mode: 0644
  - src: @STAGING@/share/file-manager/actions/craftdriver-pin.desktop
    dst: /usr/share/file-manager/actions/craftdriver-pin.desktop
    file_info:
      mode: 0644
  - src: @STAGING@/share/file-manager/actions/craftdriver-free.desktop
    dst: /usr/share/file-manager/actions/craftdriver-free.desktop
    file_info:
      mode: 0644
  - src: @STAGING@/share/file-manager/actions/craftdriver-status.desktop
    dst: /usr/share/file-manager/actions/craftdriver-status.desktop
    file_info:
      mode: 0644
  - src: @STAGING@/share/file-manager/actions/craftdriver-share.desktop
    dst: /usr/share/file-manager/actions/craftdriver-share.desktop
    file_info:
      mode: 0644
  - src: @STAGING@/share/file-manager/actions/craftdriver-versions.desktop
    dst: /usr/share/file-manager/actions/craftdriver-versions.desktop
    file_info:
      mode: 0644
  # Thunar não tem uca.xml de sistema que possamos estender: fica o trecho + o script de mescla.
  - src: @STAGING@/share/craftdriver/thunar/uca.xml
    dst: /usr/share/craftdriver/thunar/uca.xml
    file_info:
      mode: 0644
  - src: @STAGING@/share/craftdriver/thunar/install-uca.py
    dst: /usr/share/craftdriver/thunar/install-uca.py
    file_info:
      mode: 0755
  - src: @STAGING@/share/icons/hicolor/256x256/apps/craftdriver.png
    dst: /usr/share/icons/hicolor/256x256/apps/craftdriver.png
    file_info:
      mode: 0644
  - src: @STAGING@/share/icons/hicolor/scalable/apps/craftdriver.svg
    dst: /usr/share/icons/hicolor/scalable/apps/craftdriver.svg
    file_info:
      mode: 0644
  - src: @STAGING@/share/icons/hicolor/symbolic/apps/craftdriver-symbolic.svg
    dst: /usr/share/icons/hicolor/symbolic/apps/craftdriver-symbolic.svg
    file_info:
      mode: 0644
  - src: @STAGING@/share/metainfo/io.github.kaike_png.craftdriver.metainfo.xml
    dst: /usr/share/metainfo/io.github.kaike_png.craftdriver.metainfo.xml
    file_info:
      mode: 0644
  - src: @STAGING@/LICENSE
    dst: /usr/share/licenses/craftdriver/LICENSE
    file_info:
      mode: 0644
  - src: @STAGING@/LICENSE.fonts
    dst: /usr/share/licenses/craftdriver/LICENSE.fonts
    file_info:
      mode: 0644
  - src: @STAGING@/README.md
    dst: /usr/share/doc/craftdriver/README.md
    file_info:
      mode: 0644
  - src: @STAGING@/CHANGELOG.md
    dst: /usr/share/doc/craftdriver/CHANGELOG.md
    file_info:
      mode: 0644

rpm:
  summary: Cliente para OneDrive e SharePoint com arquivos sob demanda
  group: Applications/Internet
  compression: zstd
deb:
  compression: zstd
